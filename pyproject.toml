[project]
name = "gatekeeper"
version = "0.1.0"
description = "Automated Health Data Access Body for the European Health Data Space"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==2.3.0",
    "duckdb==2.0.0",
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "pydantic==2.14.2",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Long literal strings: LLM prompt text, decision-letter wording and expected reasons.
"backend/decide.py" = ["E501"]
"eval/*/reference.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "eval", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true
